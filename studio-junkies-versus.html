<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Studio Junkies VS</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{background:#0d0d1a;color:#e0e0e0;font-family:'Press Start 2P',monospace;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px);pointer-events:none;z-index:9999;}
:root{
  --bg-deep:#0d0d1a;--bg-dark:#1a1a2e;--bg-panel:#16213e;--bg-card:#0f3460;--bg-input:#0a0a1a;
  --purple:#7b2fff;--purple-dim:#4a1e99;--purple-glow:#9d5cff;--purple-pale:#2a1050;
  --fl-orange:#ff6b00;--fl-dim:#7a3300;--gold:#ffd700;--green:#00e676;--red:#ff1744;
  --text-main:#e8e0ff;--text-muted:#7070a0;--border:#2a2a5a;--pixel-shadow:3px 3px 0 rgba(0,0,0,0.8);
}
/* BUTTONS */
.px-btn{font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:.5px;border:none;cursor:pointer;padding:10px 14px;border-radius:0;text-transform:uppercase;transition:transform .08s,filter .08s;outline:none;}
.px-btn:active{transform:translate(2px,2px);filter:brightness(.85);}
.px-btn-purple{background:var(--purple);color:#fff;box-shadow:4px 4px 0 var(--purple-dim);}
.px-btn-purple:hover{background:var(--purple-glow);}
.px-btn-orange{background:var(--fl-orange);color:#fff;box-shadow:4px 4px 0 var(--fl-dim);}
.px-btn-dark{background:var(--bg-card);color:var(--text-main);border:2px solid var(--border);box-shadow:3px 3px 0 rgba(0,0,0,.6);}
.px-btn-dark:hover{border-color:var(--purple);color:var(--purple-glow);}
.px-btn-red{background:var(--red);color:#fff;box-shadow:4px 4px 0 #7a0000;}
.px-btn-sm{font-size:7px;padding:7px 10px;}
.px-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
/* INPUTS */
.px-input{font-family:'Press Start 2P',monospace;font-size:7px;background:var(--bg-input);color:var(--text-main);border:2px solid var(--border);padding:10px 12px;width:100%;outline:none;transition:border-color .15s;border-radius:0;}
.px-input:focus{border-color:var(--purple);box-shadow:0 0 0 2px var(--purple-pale);}
.px-input::placeholder{color:var(--text-muted);}
.px-label{font-size:7px;color:var(--purple-glow);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px;}
/* BADGES */
.px-badge{font-family:'Press Start 2P',monospace;font-size:6px;padding:4px 8px;border-radius:0;text-transform:uppercase;letter-spacing:1px;border:2px solid;}
.badge-open{background:rgba(0,230,118,.12);color:var(--green);border-color:var(--green);}
.badge-voting{background:rgba(123,47,255,.2);color:var(--purple-glow);border-color:var(--purple);}
.badge-closed{background:rgba(80,80,80,.2);color:#666;border-color:#444;}
/* BLINK */
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.blink{animation:blink 1s step-end infinite;}
@keyframes pulse-glow{0%,100%{text-shadow:0 0 4px var(--purple),0 0 10px var(--purple);}50%{text-shadow:0 0 10px var(--purple-glow),0 0 24px var(--purple-glow);}}
.glow-text{animation:pulse-glow 2s ease-in-out infinite;color:var(--purple-glow);}
/* HEADER */
#app-header{background:var(--bg-deep);border-bottom:3px solid var(--purple);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 4px 0 rgba(123,47,255,.3);}
.brand{font-size:11px;color:var(--text-main);letter-spacing:2px;line-height:1.4;}
.brand .vs-word{color:var(--purple-glow);}
.live-indicator{font-size:7px;color:var(--green);display:flex;align-items:center;gap:6px;}
.live-dot{width:8px;height:8px;background:var(--green);border-radius:0;animation:blink 1s step-end infinite;}
/* CONNECTION STATUS */
#conn-status{font-size:6px;padding:3px 8px;text-transform:uppercase;letter-spacing:1px;}
.conn-ok{color:var(--green);}
.conn-err{color:var(--red);}
.conn-loading{color:var(--gold);}
/* TABS */
#nav-tabs{background:var(--bg-deep);border-bottom:2px solid var(--border);display:flex;}
.nav-tab{font-family:'Press Start 2P',monospace;font-size:8px;padding:14px 20px;cursor:pointer;color:var(--text-muted);border-bottom:3px solid transparent;text-transform:uppercase;letter-spacing:1px;transition:color .15s;border-right:1px solid var(--border);background:none;border-top:none;border-left:none;outline:none;}
.nav-tab:hover{color:var(--text-main);}
.nav-tab.active{color:var(--purple-glow);border-bottom-color:var(--purple);background:rgba(123,47,255,.06);}
/* MAIN */
#main-wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px;}
.section{display:none;}
.section.active{display:block;}
/* LOBBY LIST */
.lobby-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.section-title{font-size:9px;color:var(--purple-glow);letter-spacing:2px;text-transform:uppercase;}
.lobby-item{background:var(--bg-panel);border:2px solid var(--border);padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:border-color .15s,background .15s;box-shadow:var(--pixel-shadow);}
.lobby-item:hover{border-color:var(--purple);background:rgba(123,47,255,.06);}
.lobby-name{font-size:8px;color:var(--text-main);margin-bottom:6px;}
.lobby-meta{font-size:6px;color:var(--text-muted);line-height:1.8;}
.lobby-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.empty-state{text-align:center;padding:40px 20px;font-size:8px;color:var(--text-muted);line-height:2.5;}
.insert-coin{color:var(--gold);}
/* LOADING SPINNER */
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
/* FORM */
.form-section{background:var(--bg-panel);border:2px solid var(--border);padding:20px;box-shadow:var(--pixel-shadow);}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-group{margin-bottom:14px;}
.form-divider{border:none;border-top:2px solid var(--border);margin:18px 0;}
.form-section-head{font-size:7px;color:var(--fl-orange);text-transform:uppercase;letter-spacing:2px;margin-bottom:14px;}
.back-row{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.page-title{font-size:9px;color:var(--text-main);letter-spacing:1px;}
/* BATTLE ARENA */
.arena-header{background:var(--bg-deep);border:2px solid var(--purple);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;box-shadow:0 0 12px rgba(123,47,255,.3);}
.arena-title{font-size:8px;color:var(--text-main);}
.matchup-grid{display:grid;grid-template-columns:1fr 56px 1fr;gap:10px;align-items:start;margin-bottom:16px;}
.corner{background:var(--bg-panel);border:2px solid var(--border);padding:14px;box-shadow:var(--pixel-shadow);transition:border-color .2s;}
.corner.voted{border-color:var(--purple);box-shadow:0 0 14px rgba(123,47,255,.35);}
.corner-avatar{width:44px;height:44px;background:var(--purple-pale);border:3px solid var(--purple-dim);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--purple-glow);margin:0 auto 8px;}
.corner-name{font-size:8px;color:var(--text-main);text-align:center;margin-bottom:4px;}
.corner-beat{font-size:6px;color:var(--text-muted);text-align:center;margin-bottom:12px;line-height:1.8;}
/* PLAYER */
.pixel-player{background:var(--bg-input);border:2px solid var(--border);padding:10px;margin-bottom:10px;}
.player-controls{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.play-btn{width:30px;height:30px;background:var(--purple);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 var(--purple-dim);flex-shrink:0;transition:transform .08s;}
.play-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--purple-dim);}
.play-btn:disabled{opacity:.3;cursor:not-allowed;}
.play-btn svg{width:14px;height:14px;fill:#fff;}
.player-time{font-size:6px;color:var(--text-muted);min-width:48px;text-align:right;}
.progress-bar-bg{background:var(--bg-deep);height:6px;border:1px solid var(--border);cursor:pointer;position:relative;}
.progress-bar-fill{height:100%;background:var(--purple);width:0%;transition:width .25s linear;position:relative;}
.progress-bar-fill::after{content:'';position:absolute;right:-3px;top:-3px;width:6px;height:12px;background:var(--purple-glow);}
.waveform{display:flex;align-items:flex-end;gap:2px;height:30px;margin-bottom:8px;}
.wv-bar{flex:1;background:var(--border);transition:background .1s;}
.wv-bar.lit{background:var(--purple-glow);}
.wv-bar.played{background:var(--purple-dim);}
.no-audio{font-size:6px;color:var(--text-muted);text-align:center;padding:4px 0;line-height:2;}
.upload-beat-btn{font-family:'Press Start 2P',monospace;font-size:6px;background:transparent;border:2px dashed var(--purple-dim);color:var(--purple-glow);padding:8px;cursor:pointer;width:100%;text-align:center;text-transform:uppercase;letter-spacing:1px;transition:border-color .15s,background .15s;}
.upload-beat-btn:hover{border-color:var(--purple);background:rgba(123,47,255,.08);}
.upload-beat-btn:disabled{opacity:.4;cursor:not-allowed;}
.upload-progress{font-size:6px;color:var(--gold);text-align:center;padding:4px 0;}
input[type=file].hidden-file{display:none;}
/* VOTES */
.vote-count{font-size:28px;color:var(--text-main);text-align:center;margin-bottom:2px;line-height:1;}
.vote-label{font-size:6px;color:var(--text-muted);text-align:center;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;}
.vote-split-bg{background:var(--bg-input);border:1px solid var(--border);height:8px;margin-bottom:10px;}
.vote-split-fill{height:100%;background:var(--purple);width:50%;transition:width .4s;}
.vote-btn{font-family:'Press Start 2P',monospace;font-size:7px;width:100%;padding:10px 6px;border:2px solid var(--border);background:transparent;color:var(--text-muted);cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all .15s;box-shadow:3px 3px 0 rgba(0,0,0,.5);}
.vote-btn:hover:not(:disabled){border-color:var(--purple);color:var(--purple-glow);background:rgba(123,47,255,.1);}
.vote-btn.voted{background:rgba(123,47,255,.2);border-color:var(--purple);color:var(--purple-glow);box-shadow:0 0 8px rgba(123,47,255,.4);}
.vote-btn:disabled{cursor:not-allowed;opacity:.5;}
/* VS */
.vs-col{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:36px;gap:10px;}
.vs-text{font-size:18px;text-shadow:0 0 8px rgba(157,92,255,.7),2px 2px 0 var(--purple-dim);letter-spacing:2px;}
/* ADMIN BAR */
.admin-bar{background:rgba(255,107,0,.08);border:2px solid var(--fl-orange);padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.admin-bar-label{font-size:6px;color:var(--fl-orange);text-transform:uppercase;letter-spacing:1px;}
/* CHAT */
.chat-box{background:var(--bg-panel);border:2px solid var(--border);box-shadow:var(--pixel-shadow);}
.chat-head{background:var(--bg-deep);border-bottom:2px solid var(--border);padding:8px 14px;font-size:7px;color:var(--purple-glow);text-transform:uppercase;letter-spacing:2px;display:flex;align-items:center;gap:8px;}
.chat-messages{height:140px;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:var(--purple-dim) var(--bg-input);}
.chat-messages::-webkit-scrollbar{width:4px;}
.chat-messages::-webkit-scrollbar-thumb{background:var(--purple-dim);}
.chat-msg{font-size:7px;color:var(--text-main);line-height:1.9;word-break:break-word;}
.chat-msg .msg-user{color:var(--purple-glow);}
.chat-msg.sys-msg .msg-user{color:var(--fl-orange);}
.chat-input-row{display:flex;border-top:2px solid var(--border);}
.chat-input-row .px-input{border:none;border-right:2px solid var(--border);font-size:7px;}
.chat-input-row .px-input:focus{box-shadow:none;border-color:var(--purple);}
.chat-send{font-family:'Press Start 2P',monospace;font-size:7px;background:var(--purple);color:#fff;border:none;padding:0 14px;cursor:pointer;flex-shrink:0;text-transform:uppercase;letter-spacing:1px;}
.chat-send:hover{background:var(--purple-glow);}
/* USERNAME MODAL */
#username-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:center;justify-content:center;}
.modal-box{background:var(--bg-panel);border:3px solid var(--purple);padding:28px;max-width:380px;width:90%;box-shadow:0 0 30px rgba(123,47,255,.5);}
.modal-title{font-size:10px;color:var(--purple-glow);margin-bottom:6px;text-align:center;}
.modal-sub{font-size:6px;color:var(--text-muted);margin-bottom:20px;text-align:center;line-height:2;}
/* LEADERBOARD */
.lb-row{background:var(--bg-panel);border:2px solid var(--border);padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:14px;box-shadow:var(--pixel-shadow);}
.lb-rank{font-size:14px;width:30px;color:var(--text-muted);flex-shrink:0;}
.lb-rank.r1{color:var(--gold);}
.lb-rank.r2{color:#c0c0c0;}
.lb-rank.r3{color:#cd7f32;}
.lb-avatar{width:36px;height:36px;background:var(--purple-pale);border:2px solid var(--purple-dim);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--purple-glow);flex-shrink:0;}
.lb-info{flex:1;}
.lb-name{font-size:8px;color:var(--text-main);margin-bottom:4px;}
.lb-stat{font-size:6px;color:var(--text-muted);}
.lb-wins{font-size:16px;color:var(--purple-glow);}
/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-panel);border:2px solid var(--purple);color:var(--text-main);font-size:7px;padding:10px 18px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 0 16px rgba(123,47,255,.4);}
#toast.show{opacity:1;}
/* SCROLLBAR */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--bg-deep);}
::-webkit-scrollbar-thumb{background:var(--purple-dim);}
/* RESPONSIVE */
@media(max-width:600px){
  .brand{font-size:8px;}
  .matchup-grid{grid-template-columns:1fr;}
  .vs-col{flex-direction:row;padding-top:0;margin:8px 0;justify-content:center;}
  .form-grid-2{grid-template-columns:1fr;}
  .nav-tab{font-size:6px;padding:12px 10px;}
  .admin-bar{flex-direction:column;align-items:flex-start;}
}
</style>
</head>
<body>

<!-- USERNAME MODAL -->
<div id="username-modal">
  <div class="modal-box">
    <div class="modal-title">ENTER YOUR NAME</div>
    <div class="modal-sub">Choose a producer name to<br>enter the arena</div>
    <div class="form-group">
      <label class="px-label" for="username-input">Producer Name</label>
      <input class="px-input" id="username-input" placeholder="e.g. DrWavez" maxlength="20" />
    </div>
    <button class="px-btn px-btn-purple" id="username-submit" style="width:100%;margin-top:8px;">▶ ENTER ARENA</button>
  </div>
</div>

<!-- HEADER -->
<header id="app-header">
  <div class="brand">STUDIO JUNKIES <span class="vs-word">VS</span></div>
  <div style="display:flex;align-items:center;gap:14px;">
    <span id="conn-status" class="conn-loading"><span class="spinner"></span>CONNECTING...</span>
    <div class="live-indicator"><span class="live-dot"></span>LIVE</div>
    <span id="header-username" style="font-size:7px;color:var(--purple-glow);"></span>
  </div>
</header>

<!-- TABS -->
<nav id="nav-tabs">
  <button class="nav-tab active" data-tab="lobbies">▶ LOBBIES</button>
  <button class="nav-tab" data-tab="leaderboard">🏆 BOARD</button>
</nav>

<div id="main-wrap">

  <!-- LOBBIES TAB -->
  <div id="tab-lobbies" class="section active">

    <!-- LOBBY LIST -->
    <div id="view-lobby-list">
      <div class="lobby-header">
        <span class="section-title">► ACTIVE LOBBIES</span>
        <button class="px-btn px-btn-purple px-btn-sm" id="btn-open-create">+ NEW LOBBY</button>
      </div>
      <div id="lobby-list-container">
        <div class="empty-state"><span class="spinner"></span> Loading lobbies...</div>
      </div>
    </div>

    <!-- CREATE FORM -->
    <div id="view-create-form" style="display:none;">
      <div class="back-row">
        <button class="px-btn px-btn-dark px-btn-sm" id="btn-back-from-create">◄ BACK</button>
        <span class="page-title">CREATE LOBBY</span>
      </div>
      <div class="form-section">
        <div class="form-group">
          <label class="px-label" for="cf-name">Lobby Name</label>
          <input class="px-input" id="cf-name" placeholder="e.g. Friday Night Heat" maxlength="40" />
        </div>
        <hr class="form-divider" />
        <div class="form-section-head">► PLAYER 1</div>
        <div class="form-grid-2">
          <div class="form-group">
            <label class="px-label" for="cf-p1">Producer Name</label>
            <input class="px-input" id="cf-p1" placeholder="Your name" maxlength="24" />
          </div>
          <div class="form-group">
            <label class="px-label" for="cf-b1">Beat Title</label>
            <input class="px-input" id="cf-b1" placeholder="Beat title" maxlength="30" />
          </div>
        </div>
        <hr class="form-divider" />
        <div class="form-section-head">► PLAYER 2</div>
        <div class="form-grid-2">
          <div class="form-group">
            <label class="px-label" for="cf-p2">Producer Name</label>
            <input class="px-input" id="cf-p2" placeholder="Challenger name" maxlength="24" />
          </div>
          <div class="form-group">
            <label class="px-label" for="cf-b2">Beat Title</label>
            <input class="px-input" id="cf-b2" placeholder="Beat title" maxlength="30" />
          </div>
        </div>
        <hr class="form-divider" />
        <button class="px-btn px-btn-purple" id="btn-create-lobby" style="width:100%;">▶ START LOBBY</button>
      </div>
    </div>

    <!-- BATTLE VIEW -->
    <div id="view-battle" style="display:none;">
      <div class="back-row">
        <button class="px-btn px-btn-dark px-btn-sm" id="btn-back-from-battle">◄ LOBBIES</button>
        <span class="page-title" id="battle-lobby-name"></span>
      </div>

      <!-- ADMIN BAR (lobby creator only) -->
      <div class="admin-bar" id="admin-bar" style="display:none;">
        <span class="admin-bar-label">⚙ LOBBY ADMIN</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="px-btn px-btn-orange px-btn-sm" id="btn-open-voting">OPEN VOTING</button>
          <button class="px-btn px-btn-red px-btn-sm" id="btn-close-lobby">CLOSE BATTLE</button>
        </div>
      </div>

      <div class="arena-header">
        <span class="arena-title" id="arena-matchup-label"></span>
        <span id="arena-status-badge"></span>
      </div>

      <div class="matchup-grid">
        <!-- CORNER A -->
        <div class="corner" id="corner-a">
          <div class="corner-avatar" id="av-a"></div>
          <div class="corner-name" id="pname-a"></div>
          <div class="corner-beat" id="btitle-a"></div>
          <div class="pixel-player">
            <div class="waveform" id="wave-a"></div>
            <div class="player-controls">
              <button class="play-btn" id="play-a" data-side="a" disabled>
                <svg viewBox="0 0 16 16"><polygon points="4,2 14,8 4,14"/></svg>
              </button>
              <div class="progress-bar-bg" style="flex:1" id="prog-bg-a">
                <div class="progress-bar-fill" id="prog-a"></div>
              </div>
              <span class="player-time" id="time-a">0:00</span>
            </div>
            <button class="upload-beat-btn" id="upload-btn-a">▲ UPLOAD BEAT (MP3)</button>
            <input type="file" class="hidden-file" id="file-a" accept="audio/*" />
            <div class="no-audio" id="no-audio-a">No audio loaded</div>
            <div class="upload-progress" id="upload-prog-a" style="display:none;"></div>
          </div>
          <div class="vote-count" id="votes-a">0</div>
          <div class="vote-label">VOTES</div>
          <div class="vote-split-bg"><div class="vote-split-fill" id="split-a"></div></div>
          <button class="vote-btn" id="vote-btn-a" data-side="a">VOTE</button>
        </div>

        <!-- VS -->
        <div class="vs-col">
          <div style="font-size:20px;">⚔</div>
          <div class="vs-text glow-text">VS</div>
          <div style="font-size:20px;">⚔</div>
        </div>

        <!-- CORNER B -->
        <div class="corner" id="corner-b">
          <div class="corner-avatar" id="av-b"></div>
          <div class="corner-name" id="pname-b"></div>
          <div class="corner-beat" id="btitle-b"></div>

/* ── SUPABASE API ────────────────────────────────────────── */
async function sbGet(table, params='') {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers: HEADERS });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPost(table, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, { method:'POST', headers: HEADERS, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPatch(table, params, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { method:'PATCH', headers: HEADERS, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbRpc(fn, body) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method:'POST', headers: HEADERS, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ── REALTIME ────────────────────────────────────────────── */
function realtimeSubscribe(table, filter, callback) {
  const wsUrl = SUPABASE_URL.replace('https','wss') + '/realtime/v1/websocket?apikey=' + SUPABASE_KEY + '&vsn=1.0.0';
  const ws = new WebSocket(wsUrl);
  const topic = `realtime:public:${table}${filter ? ':' + filter : ''}`;
  ws.onopen = () => {
    ws.send(JSON.stringify({ topic, event:'phx_join', payload:{}, ref:'1' }));
    setInterval(() => ws.send(JSON.stringify({ topic:'phoenix', event:'heartbeat', payload:{}, ref:'hb' })), 25000);
  };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.event === 'INSERT' || msg.event === 'UPDATE' || msg.event === 'DELETE') {
      callback(msg.event, msg.payload?.record || msg.payload?.new || {});
    }
  };
  ws.onerror = () => {};
  return ws;
}

/* ── STORAGE UPLOAD ──────────────────────────────────────── */
async function uploadBeat(file, side) {
  const ext  = file.name.split('.').pop();
  const path = `beats/${Date.now()}-${side}.${ext}`;
  const r    = await fetch(`${SUPABASE_URL}/storage/v1/object/${path}`, {
    method:'POST',
    headers:{ 'apikey': SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Content-Type': file.type },
    body: file
  });
  if (!r.ok) throw new Error('Upload failed');
  return `${SUPABASE_URL}/storage/v1/object/public/${path}`;
}

/* ── WAVEFORM ────────────────────────────────────────────── */
function buildWaveform(side) {
  const el = document.getElementById(`wave-${side}`);
  el.innerHTML = Array.from({length:32},()=>`<div class="wv-bar" style="height:${Math.floor(Math.random()*22)+4}px"></div>`).join('');
}
function animateWave(side, progress) {
  const bars = document.getElementById(`wave-${side}`).querySelectorAll('.wv-bar');
  const lit  = Math.floor(progress * bars.length);
  bars.forEach((b,i) => { b.classList.toggle('played', i<lit); b.classList.toggle('lit', i===lit); });
}

/* ── AUDIO PLAYER ────────────────────────────────────────── */
function stopAudio(side) {
  const el = audioEls[side];
  if (!el.paused) el.pause();
  document.getElementById(`play-${side}`).innerHTML = '<svg viewBox="0 0 16 16"><polygon points="4,2 14,8 4,14"/></svg>';
}
function setupAudioListeners(side) {
  const el = audioEls[side];
  el.ontimeupdate = () => {
    if (!el.duration) return;
    const pct = el.currentTime / el.duration * 100;
    document.getElementById(`prog-${side}`).style.width = Math.round(pct*10)/10 + '%';
    document.getElementById(`time-${side}`).textContent = fmtTime(el.currentTime) + ' / ' + fmtTime(el.duration);
    animateWave(side, el.currentTime/el.duration);
  };
  el.onended = () => {
    document.getElementById(`play-${side}`).innerHTML = '<svg viewBox="0 0 16 16"><polygon points="4,2 14,8 4,14"/></svg>';
    document.getElementById(`prog-${side}`).style.width = '0%';
    animateWave(side, 0);
  };
  document.getElementById(`prog-bg-${side}`).onclick = (e) => {
    if (!el.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    el.currentTime = ((e.clientX-rect.left)/rect.width) * el.duration;
  };
}
function fmtTime(s) {
  if (isNaN(s)||s<0) return '0:00';
  return `${Math.floor(s/60)}:${Math.floor(s%60).toString().padStart(2,'0')}`;
}

['a','b'].forEach(side => {
  document.getElementById(`play-${side}`).addEventListener('click', () => {
    const me = audioEls[side], other = audioEls[side==='a'?'b':'a'];
    if (!me.paused) {
      me.pause();
      document.getElementById(`play-${side}`).innerHTML = '<svg viewBox="0 0 16 16"><polygon points="4,2 14,8 4,14"/></svg>';
    } else {
      if (!other.paused) { other.pause(); document.getElementById(`play-${side==='a'?'b':'a'}`).innerHTML = '<svg viewBox="0 0 16 16"><polygon points="4,2 14,8 4,14"/></svg>'; }
      me.play().catch(()=>{});

    }
  });
});

function updateVoteDisplay() {
  const l = currentLobby;

  document.getElementById('votes-a').textContent = va;
  document.getElementById('votes-b').textContent = vb;
  document.getElementById('split-a').style.width = Math.round(va/total*100)+'%';
  document.getElementById('split-b').style.width = Math.round(vb/total*100)+'%';
}

async function hasVoted(lobbyId) {
  const token = getVoterToken();
  try {
    const res = await sbGet('votes', `lobby_id=eq.${lobbyId}&voter_token=eq.${token}`);
    return res.length > 0 ? res[0].side : null;
  } catch(e) { return null; }
}

function renderVoteButtons() {
  const l = currentLobby;
  const closed = l.status==='closed';
  hasVoted(l.id).then(voted => {
    ['a','b'].forEach(side => {
      const btn = document.getElementById(`vote-btn-${side}`);
      btn.disabled = !!(voted||closed);
      btn.className = 'vote-btn'+(voted===side?' voted':'');
      if (closed) {
        const winner = l.votes_a>l.votes_b?'a':l.votes_b>l.votes_a?'b':null;
        btn.textContent = side===winner ? '🏆 WINNER' : 'FINAL';
      } else {
        btn.textContent = voted===side ? '✓ VOTED' : 'VOTE';
      }
      document.getElementById(`corner-${side}`).className = 'corner'+(voted===side?' voted':'');
    });
  });
}

['a','b'].forEach(side => {
  document.getElementById(`vote-btn-${side}`).addEventListener('click', async () => {
    if (!currentLobby || currentLobby.status==='closed') return;
    const already = await hasVoted(currentLobby.id);
    if (already) return;
    const token = getVoterToken();
    try {
      await sbPost('votes', { lobby_id: currentLobby.id, voter_token: token, side });
      const field = side==='a' ? 'votes_a' : 'votes_b';
      const newCount = (currentLobby[field]||0)+1;
      await sbPatch('lobbies', `id=eq.${currentLobby.id}`, { [field]: newCount });
      currentLobby[field] = newCount;
      updateVoteDisplay();
      renderVoteButtons();
      const prod = side==='a'?currentLobby.p1_name:currentLobby.p2_name;
      await postChat(currentLobby.id, 'System', `Vote cast for ${prod}! 🎮`, true);
      toast('Vote locked in!');
    } catch(e) { toast('Vote failed — try again'); }
  });
});

    ['cf-name','cf-p1','cf-p2','cf-b1','cf-b2'].forEach(id => document.getElementById(id).value='');
    btn.disabled=false; btn.textContent='▶ START LOBBY';
    await postChat(lobby.id,'System',`Lobby "${name}" is open! Upload your beats to start. 🎵`,true);
    currentLobby = lobby;
    showView('battle');
    renderBattle();
    subscribeToBattle(lobby.id);
    loadChat(lobby.id);
    toast('Lobby created!');
  } catch(e) {
    btn.disabled=false; btn.textContent='▶ START LOBBY';
    toast('Failed to create lobby');
  }
});

/* ── CHAT ────────────────────────────────────────────────── */
async function loadChat(lobbyId) {
  try {
    const msgs = await sbGet('chat_messages', `lobby_id=eq.${lobbyId}&order=created_at.asc&limit=60`);
    const box  = document.getElementById('chat-messages');
    box.innerHTML = msgs.map(m =>
      `<div class="chat-msg${m.is_system?' sys-msg':''}"><span class="msg-user">${m.username}:</span> ${m.message}</div>`
    ).join('');
    box.scrollTop = box.scrollHeight;
    subscribeToChatUpdates(lobbyId);
  } catch(e){}
}

function subscribeToChatUpdates(lobbyId) {
  if (chatSub) { try { chatSub.close(); } catch(e){} }
  chatSub = realtimeSubscribe('chat_messages', `lobby_id=eq.${lobbyId}`, (event, record) => {
    if (event==='INSERT' && record.lobby_id===lobbyId) {
      const box = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = 'chat-msg'+(record.is_system?' sys-msg':'');
      div.innerHTML = `<span class="msg-user">${record.username}:</span> ${record.message}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  });
}

async function postChat(lobbyId, username, message, isSystem=false) {
  try { await sbPost('chat_messages', { lobby_id:lobbyId, username, message, is_system:isSystem }); } catch(e){}
}

document.getElementById('chat-send-btn').addEventListener('click', sendChat);
document.getElementById('chat-input').addEventListener('keydown', e => { if(e.key==='Enter') sendChat(); });
async function sendChat() {
  const input = document.getElementById('chat-input');
  const val   = input.value.trim();
  if (!val||!currentLobby) return;
  input.value='';
  await postChat(currentLobby.id, currentUser||'Anon', val);
}

/* ── LEADERBOARD ─────────────────────────────────────────── */
async function loadLeaderboard() {
  const cont = document.getElementById('lb-container');
  cont.innerHTML = '<div class="empty-state"><span class="spinner"></span> Loading...</div>';
  try {
    const lobbies = await sbGet('lobbies', 'status=eq.closed&order=created_at.desc');
    const wins = {};
    lobbies.forEach(l => {
      const w = l.votes_a>l.votes_b?l.p1_name:l.votes_b>l.votes_a?l.p2_name:null;
      if (w) wins[w]=(wins[w]||0)+1;
    });
    const sorted = Object.entries(wins).sort((a,b)=>b[1]-a[1]);
    if (!sorted.length) { cont.innerHTML='<div class="empty-state"><span class="insert-coin">NO DATA YET</span><br><br>Close a battle to<br>populate the Hall of Fame.</div>'; return; }
    const rc = i=>i===0?'r1':i===1?'r2':i===2?'r3':'';
    const md = i=>i===0?'👑':i===1?'🥈':i===2?'🥉':'#'+(i+1);
    cont.innerHTML = sorted.map(([name,w],i)=>`
      <div class="lb-row">
        <div class="lb-rank ${rc(i)}">${md(i)}</div>
        <div class="lb-avatar">${name[0].toUpperCase()}</div>
        <div class="lb-info"><div class="lb-name">${name}</div><div class="lb-stat">wins</div></div>
        <div class="lb-wins">${w}</div>
      </div>`).join('');
  } catch(e){ cont.innerHTML='<div class="empty-state" style="color:var(--red);">Failed to load.</div>'; }
}

/* ── INIT ────────────────────────────────────────────────── */
initUsernameModal();
testConnection();
loadLobbies();
subscribeToLobbies();
</script>
